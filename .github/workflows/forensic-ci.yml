name: Forensic Intelligence CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff bandit
      - name: Ruff lint
        run: ruff check app.py forensic_core.py tests
      - name: Ruff format check
        run: ruff format --check app.py forensic_core.py tests
      - name: Bandit security scan
        run: bandit -r app.py forensic_core.py -ll
      - name: Forensic regression tests
        run: pytest -q --cov=forensic_core --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-coverage-py${{ matrix.python-version }}
          path: coverage.xml
